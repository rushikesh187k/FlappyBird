<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click at your own risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1020;--ink:#eef2ff;--muted:#9aa3c7;--blue:#7cc4ff;--card:#171b33;--line:#2a3158;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#0d1020}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(124,196,255,.16),transparent 55%);pointer-events:none}
main{position:relative;width:100%;max-width:380px;text-align:center}
.step{display:none}.step.on{display:block}
h1{font-size:2.1rem;line-height:1.05;font-weight:800;margin:0 0 14px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 28px;font-size:1.05rem;line-height:1.45}
button{font:inherit;font-weight:800;font-size:1.1rem;color:#06142b;background:var(--blue);border:0;border-radius:14px;padding:16px 36px;width:100%;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.risk{margin-top:14px;font-size:.9rem;color:var(--muted)}
.frame{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.frame img{display:block;width:100%;height:auto;border-radius:14px;background:#fff}
.cap{margin-top:18px;font-weight:800;font-size:1.4rem}
body.first{background:#000}
body.first::before{display:none}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.frame{animation:none}}
</style></head>
